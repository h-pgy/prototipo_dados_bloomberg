[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prototipo_dados_bloomberg"
version = "0.1.0"
description = "Protótipo de Dados para o projeto City Data Alliance de São Paulo com a Bloomberg."
authors = [
    { name="Henrique Pougy", email="hpougy@prefeitura.sp.gov.br" }
]
readme = "README.md"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["."]
include = ["source*"]
